# What the shared release tooling needs to know about provui. Everything not
# stated here is a default in lib/repo.nu — the manifest, the changelog path,
# the cliff config, and that this is a Cargo workspace.
name = "provui"
url = "https://github.com/diaryx-org/provui"
release_branch = "main"

# What to run before cutting. Each repo owns its own CI; this names it.
verify = "cargo xtask ci"

# Not on crates.io: provui is consumed from git, by commit, so a tag is a name
# for a commit and sets nothing off. provui-core 0.7.0 was the last version
# uploaded.
publishes = false

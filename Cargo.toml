[workspace]
resolver = "3"
# Listed rather than globbed, the way the rest of the family does it: the
# frontends (a TUI over leaf-ratatui + flower-ratatui, a UniFFI facade later)
# will be members too, and each one wants a line saying why it is here.
members = [
  # The composition itself: no drawing, no event loop, no terminal.
  "crates/provui-core",
  # The first frontend, and the reason the core is shaped the way it is: one
  # binary linking one copy of each library, so the composition is exercised
  # under a real event loop before any FFI is written.
  "crates/provui-tui",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
# Edition 2024 needs 1.85; flower-core's floor is 1.88, and a dependency's floor
# is this crate's floor.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/provui"
readme = "README.md"

[workspace.dependencies]
# The self-describing plaintext workspace library. Defaults to `yaml` alone,
# which is the carrier `---` frontmatter uses; a frontend that wants JSON/TOML
# vaults turns those features on.
prov = "0.11"
# The Zig-backed config AST + lossless editor prov and flower are both built on.
# Named directly because `ProvBackend` reaches for `fig::Embed::replace_body` and
# `fig::Value`, which are the tree and the splice both halves agree on.
fig = "3.1"
# The generic structural metadata editor. `ProvBackend` is an implementation of
# its `Backend` trait; nothing here is upstreamed into it, because flower-core
# does not know the word "prov" and should not learn it.
flower-core = "0.4.0"
# The rich-text body editor over twig. `default-features = false` so a consumer
# that also links `leaf-ffi` unifies on one leaf-core copy and one twig-sys
# build rather than two.
leaf-core = { version = "0.1.4", default-features = false }

# The two terminal widgets, which `provui-tui` embeds. Neither is on crates.io
# yet, so both are consumed the prepublication way: by the version their repo
# declares, resolved through the `[patch.crates-io]` in `~/diaryx/.cargo/
# config.toml` (see `~/diaryx/.cargo/patches.toml`). No path across a repository
# boundary appears in this file, so nothing here has to be undone to publish.
#
# The two core requirements above are pinned to a patch level for a related
# reason: each widget path-depends on its own core, and a requirement loose
# enough to admit an older registry copy lets the lockfile keep one — at which
# point the patch quietly goes unused and the graph holds two `Model`s and two
# `Doc`s that are not the same type. (`cargo update -p <crate>` is what forces
# re-resolution after turning a patch on; `cargo tree -i leaf-core` is what
# proves it took.)
#
# They are pinned to the newest *published* version rather than to whatever the
# checkout happens to be, which is why `leaf-core` says 0.1.4 while the leaf
# checkout is 0.1.5. `provui-core` is a publishable crate, and a requirement no
# registry can satisfy would make it unbuildable for anyone without these
# checkouts — the patch is a local convenience and must never be load-bearing
# for it. 0.1.5 satisfies `^0.1.4` regardless, so the patch still takes.
leaf-ratatui = "0.1.5"
flower-ratatui = "0.4.0"

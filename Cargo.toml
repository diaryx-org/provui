[workspace]
resolver = "3"
# Listed rather than globbed, the way the rest of the family does it: the
# frontends (a TUI over leaf-ratatui + flower-ratatui, a UniFFI facade later)
# will be members too, and each one wants a line saying why it is here.
members = [
  # The composition itself: no drawing, no event loop, no terminal.
  "crates/provui-core",
  # The first frontend, and the reason the core is shaped the way it is: one
  # binary linking one copy of each library, so the composition is exercised
  # under a real event loop before any FFI is written.
  "crates/provui-tui",
  # This repo's CI, as a program: `cargo xtask <job>` runs one job and
  # `cargo xtask ci` runs them all, in the order `.github/workflows/ci.yml` does.
  "xtask",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
# Edition 2024 needs 1.85; flower-core's floor is 1.88, and a dependency's floor
# is this crate's floor.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/provui"
readme = "README.md"
# Not on crates.io. provui-core is consumed from git, and its prov dependency is
# a git one, which crates.io would refuse anyway.
publish = false

[workspace.dependencies]
# The self-describing plaintext workspace library. Defaults to `yaml` alone,
# which is the carrier `---` frontmatter uses; a frontend that wants JSON/TOML
# vaults turns those features on.
#
# From git, not crates.io: prov is an org repository that does not publish, and
# every repository that builds against it names this same source — `branch =
# "main"`, written identically — so diaryx, which links provui-core and prov
# both, holds one prov, at the commit its own Cargo.lock records.
prov = { git = "https://github.com/diaryx-org/prov", branch = "main" }
# The Zig-backed config AST + lossless editor prov and flower are both built on.
# Named directly because `ProvBackend` reaches for `fig::Embed::replace_body` and
# `fig::Value`, which are the tree and the splice both halves agree on.
fig = "5"
# Crash-atomic file writes, and the optimistic check that refuses one when the
# file moved underneath. prov writes through it too; named directly because a
# save is one document's bytes and none of prov's policy, so `DocumentSession`
# stages it itself rather than borrowing a mutate op that would restamp.
fs-transaction = "0.2"
# The generic structural metadata editor. `ProvBackend` is an implementation of
# its `Backend` trait; nothing here is upstreamed into it, because flower-core
# does not know the word "prov" and should not learn it.
flower-core = { git = "https://github.com/diaryx-org/flower", branch = "main" }
# The rich-text body editor over twig. `default-features = false` so a consumer
# that also links `leaf-ffi` unifies on one leaf-core copy and one twig-sys
# build rather than two.
leaf-core = { git = "https://github.com/diaryx-org/leaf", branch = "main", default-features = false }

# The two terminal widgets, which `provui-tui` embeds.
#
# flower and leaf, like prov, come from git, and every crate of each is named
# with the same source — `branch = "main"`, spelled identically here and in
# diaryx. That is what keeps one `Model` and one `Doc`: each widget
# path-depends on its own core inside its own repository, so a widget and a
# core from one source resolve to one copy, and a core from anywhere else would
# be a second, different type. (`cargo tree -i leaf-core` proves there is
# one.) To build against a checkout instead, turn on the git-URL patches in
# `~/diaryx/.cargo/patches.toml`.
leaf-ratatui = { git = "https://github.com/diaryx-org/leaf", branch = "main" }
flower-ratatui = { git = "https://github.com/diaryx-org/flower", branch = "main" }
